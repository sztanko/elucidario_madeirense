[project]
name = "elucidario"
version = "0.1.0"
description = "Extraction, enrichment and translation-preparation pipeline for the Elucidário Madeirense"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pymupdf>=1.24",
    "anthropic>=0.60",
    "pydantic>=2.7",
    "rapidfuzz>=3.9",
    "pyuca>=1.2",
    "pyahocorasick>=2.1",
    "spylls>=0.1.7",
    "httpx>=0.27",
    "shapely>=2.0",
    "typer>=0.12",
    "pyyaml>=6.0",
    "typesafe-sdk>=0.7.1",
    "scipy>=1.18.1",
    "numba>=0.68.0",
    "scikit-image>=0.26.0",
    "rasterio>=1.5.2",
    "pyproj>=3.8.0",
    "pillow>=12.3.0",
    "skia-python>=144.0.post2",
]

[project.scripts]
elu = "elucidario.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["elucidario"]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
