rules:
- 'Classify by what the entry IS, not what the text mostly talks about: a parish entry that is mostly church history is still
  place.parish (add building.church or event.historical as secondary).'
- Primary type first, then at most two secondaries; add a secondary only if it would be a useful filter for readers (not for
  every passing mention).
- Cross-references (kind=cross_reference, or text essentially 'Vid. X') always get meta.cross_reference as primary; add the
  target's type as secondary when it is unambiguous.
- 'Persons: choose the subtype from the role that made them notable in the Elucidário; record every other role in facets.person_roles.
  A person notable only for having written a book on Madeira is person.writer if Madeiran/Portuguese, person.visitor if foreign.'
- Foreigners with a professional role on the island (physician, merchant, naturalist, consul) take that role subtype, with
  foreign_resident or foreign_visitor in person_roles.
- person.governor is for heads of the territory or a captaincy (donatários, governors, captains-general, civil governors);
  lower officials are person.official; elected roles are person.politician. For clergy who governed (bishop-governors), use
  person.clergy with governor in person_roles.
- person.family covers surnames, lineages and noble titles; an individual titleholder (e.g. '1º Conde de X') is classified
  by role, with noble in person_roles.
- 'Organisms: a species is organism.<taxon> even if the text is mostly about its economic use; add economy.product/agriculture/fishing
  as secondary. Named crop varieties (grape castas, wheat varieties) are organism.cultivar.'
- 'Buildings versus institutions: a convent, hospital or school described as a building/site is building.*; as an organisation
  with members, statutes or staff it is institution.*. If both, the headword decides (e.g. ''Convento de X'' -> building.convent;
  ''Escola X'' -> institution.school).'
- 'Places versus structures: quintas and levadas are place.*; quays, lighthouses and forts are building.*; roads as individual
  named streets are place.street, but the road network is economy.infrastructure.'
- Compound entries take the type of their subject (e.g. 'Ribeiras' -> place.stream); add meta.list only when the parent is
  little more than a list of its children.
- 'Offices versus people: an entry on an office with its list of holders is administration.office, not person.*.'
- Use meta.overview only for umbrella/survey entries spanning several classes; a general entry on one class (e.g. 'Fauna',
  'Clima') uses that class's subtype.
- Prefer a non-meta secondary on meta.* entries whenever the subject is clear (e.g. 'Dizimos' -> meta.cross_reference, administration.tax),
  so topical filters still find them.
- Sub-entries (children of umbrella articles) are classified on their own content; the parent link records the grouping.
- 'Foreign authors known only from their works: use the profession-based subtype when stated (e.g. a botanist is person.scientist)
  and add the foreign_visitor role; use person.visitor only when no profession is known.'
- Headwords naming several features at once (e.g. 'Pontinha (Sítio, Estrada, Ilhéus e Molhe da)') stay one article with up
  to 3 types; each named feature is recorded as its own place in the knowledge base.
