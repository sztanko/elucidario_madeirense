  devotion: St Francis Borgia, Duke of Gandía and third Superior General of the Jesuits. He is venerated in Portugal and Madeira
    through the Jesuit College of Funchal and invoked against earthquakes. The Ukrainian and Russian forms are Catholic usage.
  feast: 3 October (Jesuit/Iberian; formerly 10 October)
  established: true
  also_toponym: false
  source: https://en.wikipedia.org/wiki/Francis_Borgia,_4th_Duke_of_Gand%C3%ADa
