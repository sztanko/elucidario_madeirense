  devotion: A Portuguese and Spanish invocation (Virgen de la Buena Hora) of the Virgin for a good childbirth and a good hour
    of death. The foreign names are close renderings. The nearest Eastern icon with the same role is 'Помічниця в пологах',
    but it is a different image, so it is not used here. uk/ru are Catholic-style renderings.
  feast: null
  established: false
  also_toponym: false
  source: pt.wikipedia 'Nossa Senhora da Boa Hora'; es 'Virgen de la Buena Hora'
  en: Our Lady of the Good Hour
  de: Unsere Liebe Frau von der Guten Stunde
  fr: Notre-Dame de la Bonne Heure
  it: Madonna della Buona Ora
  hu: Jó Óra Boldogasszonya
  nl: Onze-Lieve-Vrouw van het Goede Uur
  uk: Матір Божа Доброї Години
  ru: Богоматерь Доброго Часа
  uk_note: Invoked for safe childbirth and a good death. The Eastern icon 'Помічниця в пологах' is a different image and is
    not used.
  uk_established: false
Nossa Senhora de Belém:
  kind: marian
  devotion: Our Lady of Bethlehem, the Virgin shown with the newborn Christ. It is linked to Christmas and the Nativity and,
    in Portugal, to Santa Maria de Belém in Lisbon. Eastern tradition also has a Bethlehem icon of the Mother of God (Вифлеємська
    / Вифлеемская икона).
  feast: null
  established: true
  also_toponym: false
  source: Wikipedia 'Our Lady of Bethlehem'; ru.wikipedia 'Вифлеемская икона Божией Матери'
