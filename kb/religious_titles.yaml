    name in uk/ru. Boa Hora, 'of the good hour', is invoked for a safe childbirth and a good death. Its closest equivalents
    are Italian 'Madonna del Buon Parto' and Spanish 'Buena Hora', but there is no exact standard term in most of these languages.
  feast: null
  established: false
  also_toponym: false
