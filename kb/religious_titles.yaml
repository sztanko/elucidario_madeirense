  de: Franz von Borja
  fr: Saint François Borgia
  it: San Francesco Borgia
  hu: Borgia Szent Ferenc
  nl: Franciscus Borgia
  uk: Святий Франциск Борджія
  ru: Святой Франциск Борджиа
São Lázaro:
  kind: saint
  devotion: St Lazarus, patron of lepers. Lazarus of Bethany and the beggar Lazarus of the parable were merged in popular
    devotion. In Madeira the name refers mainly to the Hospital/Gafaria de São Lázaro (leper house) in Funchal and the São
    Lázaro area around it. In Ukrainian and Russian Orthodox usage he is 'Lazarus of the Four Days' (Праведний Лазар Чотириденний
    / Праведный Лазарь Четверодневный).
  feast: 17 December (traditional); 29 July (with Martha and Mary, since 2021)
  established: true
  also_toponym: true
  source: https://en.wikipedia.org/wiki/Lazarus_of_Bethany
  en: St Lazarus
  de: Heiliger Lazarus (von Betanien)
  fr: Saint Lazare
  it: San Lazzaro
  hu: Szent Lázár
  nl: Heilige Lazarus (van Betanië)
  uk: Святий Лазар
  ru: Святой Лазарь
Nossa Senhora da Conceição de Vila Viçosa:
  kind: marian
  devotion: The Immaculate Conception as venerated in the image at Vila Viçosa, Alentejo. King João IV proclaimed her Queen
    and Patroness of Portugal in 1646. The core name (Immaculate Conception) is established in every language. The additions
    'of Vila Viçosa' and 'Patroness of Portugal' are descriptive. The Ukrainian and Russian forms are Latin Catholic usage.
  feast: 8 December
  established: true
  also_toponym: false
  source: https://pt.wikipedia.org/wiki/Nossa_Senhora_da_Concei%C3%A7%C3%A3o_de_Vila_Vi%C3%A7osa
