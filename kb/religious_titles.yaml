  hu: Calhaui Boldogasszony (Kavicsparti Szűz Mária)
  nl: Onze Lieve Vrouw van Calhau (van het Kiezelstrand)
  uk: Матір Божа з Каляу
  ru: Богоматерь Кальяу (Непорочное зачатие, Фуншал)
  uk_note: The fragment 'e que' was removed. First chapel of Funchal, an Immaculate Conception dedication (8 December).
  uk_established: false
