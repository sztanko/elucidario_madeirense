  ru: Святой Доминик
São Vicente de Cabo:
  kind: saint
  devotion: St Vincent of Saragossa, deacon and martyr and patron of Lisbon. His relics were kept at Cape St Vincent (Cabo
    de São Vicente) in the Algarve, which explains 'de Cabo'. He is patron of the Madeiran parish and municipality of São
    Vicente. Ukrainian and Russian Orthodox usage calls him 'martyr Vincent the deacon' (мученик Вікентій / Викентий диакон).
  feast: 22 January
  established: true
  also_toponym: true
  source: https://en.wikipedia.org/wiki/Vincent_of_Saragossa
