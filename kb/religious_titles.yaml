  hu: Betlehemi Boldogasszony
  nl: Onze-Lieve-Vrouw van Bethlehem
  uk: Матір Божа Вифлеємська
  ru: Вифлеемская икона Божией Матери
  uk_note: Belém means Bethlehem. The title is also linked to Santa Maria de Belém, Lisbon.
  uk_established: true
Nossa Senhora do Carmo:
