  nl: Vrouwe van de steden (leenvrouwe)
  uk: Володарка міст (сеньйора)
  ru: Владетельница городов (сеньора)
Nossa Senhora do Calhau e que:
  kind: marian
  devotion: The words 'e que' are an extraction artefact; the title is Nossa Senhora do Calhau. This was the first chapel
    in Funchal, built on the pebble beach ('calhau'), also called Nossa Senhora da Conceição de Cima. It was the forerunner
    of the Santa Maria Maior (Socorro) church. It is a local title with no equivalents in other languages, so the renderings
    are coined. Calhau is also the name of the Funchal seafront area.
  feast: 8 December
  established: false
  also_toponym: true
  source: https://en.wikipedia.org/wiki/Santa_Maria_Maior_(Funchal)
