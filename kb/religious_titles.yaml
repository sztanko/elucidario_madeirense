Varadouros e Portas da cidade:
  kind: marian
  devotion: This is a local Marian title found only in Funchal, not a devotion of the wider Church. It is named after the
    Varadouros, the beach where boats were hauled ashore, and the Portão dos Varadouros, the 17th-century sea gate of the
    Funchal city walls. The image was honoured at a chapel by the gate as protector of the city gates. It is now kept in the
    Capela de Nossa Senhora dos Varadouros, a side chapel dating from the 19th century, in the Sé (cathedral) of Funchal.
    No other Catholic language uses this title, and there is no Eastern Orthodox equivalent. So all eight renderings are descriptive
    translations I made up, not established names. Because it is a Latin-rite devotion, uk/ru follow Catholic usage ('Богородиця
    / Богоматерь'). 'Varadouros' is kept as a proper name, as it is a Funchal place name. The title as a whole is a devotion,
    not mainly a place name.
  feast: null
  established: false
  also_toponym: false
  source: https://terrasdeportugal.wikidot.com/se-do-funchal
