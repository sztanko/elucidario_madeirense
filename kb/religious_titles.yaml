  en: Our Lady of Deliverance
  de: Unsere Liebe Frau von der Befreiung
  fr: Notre-Dame de la Délivrance
  it: Madonna della Liberazione
  hu: Szabadító Boldogasszony
  nl: Onze-Lieve-Vrouw van de Verlossing
  uk: Богородиця Визволителька
  ru: Богородица Избавительница
  uk_note: The fragment 'e que' was removed. Same as Nossa Senhora do Livramento.
  uk_established: true
  alias_of: Nossa Senhora do Livramento e que
