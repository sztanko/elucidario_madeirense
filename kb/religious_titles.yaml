São Tiago:
  kind: saint
  devotion: 'St James the Greater (son of Zebedee, apostle, patron of Santiago de Compostela), as you asked. Warning: in Madeira,
    ''São Tiago'' often means St James the Less (São Tiago Menor). He was chosen in 1521, during a plague, as patron of Funchal
    and of the diocese. His feast is 1 May, and the Forte de São Tiago in Funchal is named after him. Check the context in
    the Elucidário. If it means St James the Less, use: en St James the Less; de Jakobus der Jüngere; fr saint Jacques le
    Mineur; it san Giacomo il Minore; hu ifjabb Szent Jakab; nl Jakobus de Mindere; uk святий Яків Алфеїв; ru апостол Иаков
    Алфеев.'
  feast: 25 July (James the Greater); 1 May if James the Less (Funchal patron)
  established: true
  also_toponym: false
  source: https://www.funchal.pt/sao-tiago-menor-padroeiro-do-funchal/; https://www.vaticannews.va/pt/igreja/news/2021-01/diocese-funchal-celebracao-500-anos-padroeiro-sao-tiago-menor.html
  en: St James the Greater
  de: Jakobus der Ältere
  fr: saint Jacques le Majeur
  it: san Giacomo il Maggiore
  hu: idősebb Szent Jakab
  nl: Jakobus de Meerdere
  uk: святий Яків (Яків Зеведеїв)
  ru: апостол Иаков Зеведеев
Santa Cruz:
  kind: christological
  devotion: The Holy Cross of Christ. In Portugal it was traditionally honoured on 3 May (the Finding of the Holy Cross),
    and the Exaltation of the Cross falls on 14 September. The Madeiran town and municipality of Santa Cruz was probably named
    after this devotion, but its parish church is dedicated to São Salvador. The uk and ru names give the plain phrase 'Holy
    Cross', which both Eastern and Catholic usage share. The 14 September feast is Воздвиження Чесного Хреста in uk and Воздвижение
    Креста Господня in ru.
  feast: 3 May (Finding of the Holy Cross, traditional Portuguese date); 14 September (Exaltation of the Holy Cross)
  established: true
  also_toponym: true
  source: Wikipedia articles on the Exaltation and the Finding of the Holy Cross, in each language; Elucidário Madeirense
    entry on Santa Cruz
