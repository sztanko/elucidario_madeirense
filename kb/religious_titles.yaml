Senhora das Vilas:
  kind: other
  devotion: Not a recognised Marian title, and searches found no Madeiran devotion by this name. Most likely a secular phrase
    meaning 'lady (feudal holder) of the towns', used of a noblewoman or infanta who held the vilas, such as Machico or Funchal,
    in lordship. If the source context shows it is Marian, it would be a coined rendering such as 'Our Lady of the Towns'.
    The renderings are descriptive only.
  feast: null
  established: false
  also_toponym: false
  source: null
