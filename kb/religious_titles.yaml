  it: Nostra Signora della Concezione di Vila Viçosa
  hu: Vila Viçosa-i Szeplőtelen Fogantatás Szűzanyja
  nl: Onze-Lieve-Vrouw van de Onbevlekte Ontvangenis van Vila Viçosa
  uk: Непорочне Зачаття Пресвятої Діви Марії з Віла-Вісози
  ru: Непорочное Зачатие Девы Марии из Вила-Висозы (покровительница Португалии)
  uk_note: Image at Vila Viçosa (Alentejo), proclaimed Queen and Patroness of Portugal by João IV in 1646. The core feast
    name is established; the place qualifier is descriptive.
