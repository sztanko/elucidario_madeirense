Nossa Senhora da Boa Morte:
  kind: marian
  devotion: This is the Portuguese and Brazilian name for Mary's Dormition and Assumption. The Portuguese Wikipedia and Portuguese
    parish sources say the Western feast of 15 August was traditionally called 'Senhora da Boa Morte'. It matches the Eastern
    Dormition. Images show Mary lying on her deathbed. The Italian, French, English, Dutch and German names are direct Catholic
    titles that are used in the West (for example Madonna della Buona Morte, Notre-Dame de la Bonne Mort and Brazil's Sisterhood
    of the Good Death). Hungarian uses the usual Catholic name for the Assumption feast. Ukrainian and Russian use the Eastern/Byzantine
    name for the Dormition, which Greek Catholics and Latin Catholics also use.
  feast: 15 August (Dormition/Assumption)
  established: true
  also_toponym: false
  source: https://pt.wikipedia.org/wiki/Nossa_Senhora_da_Boa_Morte; https://www.upaeminium.pt/noticia/festas-em-honra-de-nossa-senhora-da-boa-morte-15agosto2024
  en: Our Lady of the Good Death
  de: Unsere Liebe Frau vom guten Tod (Mariä Heimgang)
  fr: Notre-Dame de la Bonne Mort
  it: Madonna della Buona Morte
  hu: Nagyboldogasszony (Mária elszenderülése)
  nl: Onze-Lieve-Vrouw van de Goede Dood
  uk: Успіння Пресвятої Богородиці
  ru: Успение Пресвятой Богородицы
  uk_note: Fixed by the editor. This is the Dormition/Assumption devotion (15 August). The Eastern feast name is also used
    by Greek and Latin Catholics.
  uk_established: true
  reviewed_by_owner: &id001
    uk: '2026-09-27'
